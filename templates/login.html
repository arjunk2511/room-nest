{% extends 'base.html' %}

{% block content %}
<div class="form-container">
    <h2>Login to RoomNest</h2>
    <form method="POST">
        {% csrf_token %}
        {% for field in form %}
        <div class="form-group">
            <label>{{ field.label }}</label>
            {{ field }}
            {% if field.errors %}
                <small style="color: red;">{{ field.errors|striptags }}</small>
            {% endif %}
        </div>
        {% endfor %}
        <button type="submit" class="btn btn-primary btn-block">Login</button>
    </form>
    <p style="text-align: center; margin-top: 1rem;">Don't have an account? <a href="{% url 'register' %}" style="color: var(--primary);">Register here</a>.</p>
</div>
{% endblock %}
