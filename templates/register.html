{% extends 'base.html' %}

{% block content %}
<div class="form-container">
    <h2>Create an Account</h2>
    <form method="POST">
        {% csrf_token %}
        {% for field in form %}
        <div class="form-group">
            <label>{{ field.label }}</label>
            {{ field }}
            {% if field.errors %}
                <small style="color: red;">{{ field.errors|striptags }}</small>
            {% endif %}
        </div>
        {% endfor %}
        <button type="submit" class="btn btn-primary btn-block">Register</button>
    </form>
    <p style="text-align: center; margin-top: 1rem;">Already have an account? <a href="{% url 'login' %}" style="color: var(--primary);">Login here</a>.</p>
</div>
{% endblock %}
