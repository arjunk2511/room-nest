{% extends 'base.html' %}

{% block content %}
<div style="max-width: 550px; margin: 6rem auto; background: var(--white); padding: 3.5rem; border-radius: 24px; box-shadow: var(--shadow-lg); text-align: center; border: 1px solid #e2e8f0;">
    <div style="width: 76px; height: 76px; background: #d1fae5; color: #10b981; border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 0 auto 2rem; font-size: 2.2rem; box-shadow: 0 4px 12px rgba(16, 185, 129, 0.15);">
        ✔️
    </div>
    
    <h2 style="font-size: 2rem; font-weight: 800; color: var(--text-dark); margin-bottom: 1rem;">Password Updated! 🎉</h2>
    <p style="color: #475569; font-size: 1.1rem; line-height: 1.6; margin-bottom: 2.5rem;">Your account's password has been successfully updated with zero friction. You can now use your new security credentials to sign back in securely.</p>
    
    <div style="display: flex; gap: 15px;">
        <a href="{% url 'login' %}" class="btn btn-primary" style="flex: 1; text-decoration: none; padding: 1rem; border-radius: 10px; font-weight: 700; text-align: center; box-shadow: 0 4px 14px rgba(79, 70, 229, 0.3);">Go to Sign In 🔑</a>
    </div>
</div>
{% endblock %}
