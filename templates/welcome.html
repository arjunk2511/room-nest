{% extends 'base.html' %}

{% block content %}
<div class="welcome-container" style="display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 70vh; text-align: center; padding: 2rem;">
    <h1 style="font-size: 3.5rem; margin-bottom: 1rem; color: #1e3a8a; font-weight: 700;">Welcome to RoomNest</h1>
    <p style="font-size: 1.25rem; color: #4b5563; margin-bottom: 2.5rem; max-width: 600px; line-height: 1.6;">
        The premier platform to find your perfect room or list your property to reach thousands of potential tenants in Mysore.
    </p>
    <div style="display: flex; gap: 1.5rem; flex-wrap: wrap; justify-content: center;">
        <a href="{% url 'login' %}" class="btn btn-primary" style="font-size: 1.25rem; padding: 1rem 2.5rem; min-width: 160px;">Login</a>
        <a href="{% url 'register' %}" class="btn btn-outline" style="font-size: 1.25rem; padding: 1rem 2.5rem; min-width: 160px; border: 2px solid #1e3a8a; color: #1e3a8a; font-weight: 600;">Register</a>
    </div>
</div>
{% endblock %}
